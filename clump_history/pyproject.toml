[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clump-history"
version = "0.2.0"
description = "Computational framework for carbonate clumped isotope (Δ47) forward/reordering calculations in geological samples"
readme = "../README.md"
requires-python = ">=3.7,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Keran Li", email = "keranli@smail.nju.edu.cn"},
    {name = "Additional contributors listed in GitHub"}
]
maintainers = [
    {name = "Keran Li", email = "keranli@smail.nju.edu.cn"}
]
keywords = [
    "geochemistry",
    "isotope geochemistry",
    "carbonate",
    "clumped isotopes",
    "paleothermometry",
    "geothermometry",
    "diagenesis",
    "thermal history",
    "forward modeling"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    "numpy<2.0",  # isotopylog 0.0.8 requires NumPy 1.x
    "pandas",
    "matplotlib",
    "scipy",
    "isotopylog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "jupyter",
    "pyinstaller"
]
build = [
    "pyinstaller>=5.0"
]
docs = [
    "sphinx",
    "sphinx-rtd-theme"
]

[project.urls]
Homepage = "https://github.com/keran-li/ClumpIsotope"
Repository = "https://github.com/keran-li/ClumpIsotope.git"
Documentation = "https://github.com/keran-li/ClumpIsotope#readme"
Changelog = "https://github.com/keran-li/ClumpIsotope/blob/main/clump_history/src/CHANGELOG.md"
Issues = "https://github.com/keran-li/ClumpIsotope/issues"

[project.scripts]
clump-history = "clump_history.cli:main"
clump-history-gui = "clump_history.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyinstaller]
# PyInstaller specific options
onefile = false
console = false
